<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"></div>
        <div class="name">
            <img src="logo.png" alt="App Logo">
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <div class="auth-card__header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your Vyom workspace.</p>
            </div>

            <form class="auth-form" id="signin-form">
                <label for="signin-email">Email</label>
                <input type="email" id="signin-email" placeholder="Enter your email" required>

                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" placeholder="Enter your password" required>

                <button type="submit" class="signup-btn">Sign In</button>
            </form>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-buttons">
                <button class="social-btn google-btn" type="button" data-provider="Google" title="Sign in with Google">
                    <img src="https://www.google.com/favicon.ico" alt="Google">
                </button>
                <button class="social-btn linkedin-btn" type="button" data-provider="LinkedIn" title="Sign in with LinkedIn">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230A66C2'%3E%3Cpath d='M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z'/%3E%3C/svg%3E" alt="LinkedIn">
                </button>
                <button class="social-btn facebook-btn" type="button" data-provider="Facebook" title="Sign in with Facebook">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231877F2'%3E%3Cpath d='M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z'/%3E%3C/svg%3E" alt="Facebook">
                </button>
            </div>
            <p class="provider-message" aria-live="polite"></p>
            <p class="signin-link">Don't have an account? <a href="index.html">Create one</a></p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
