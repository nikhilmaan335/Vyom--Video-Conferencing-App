<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-branding">
            <div class="brand-name">
                <img src="logo.png" alt="App Logo">
            </div>
        </div>
        <button id="theme-toggle" class="theme-toggle-button" type="button" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main class="auth-page">
        <div class="auth-panel-card">
            <div class="auth-panel-card__header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to your Vyom workspace.</p>
            </div>

            <form class="authentication-form" id="sign-in-form">
                <label for="sign-in-email">Email</label>
                <input type="email" id="sign-in-email" placeholder="Enter your email" required>

                <label for="sign-in-password">Password</label>
                <input type="password" id="sign-in-password" placeholder="Enter your password" required>

                <button type="submit" class="primary-button">Sign In</button>
            </form>

            <div class="section-divider"><span>or continue with</span></div>

            <div class="social-button-row">
                <button class="social-button google-social-button" type="button" data-provider="Google" title="Sign in with Google">
                    <img src="https://www.google.com/favicon.ico" alt="Google">
                </button>
                <button class="social-button linkedin-social-button" type="button" data-provider="LinkedIn" title="Sign in with LinkedIn">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230A66C2'%3E%3Cpath d='M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z'/%3E%3C/svg%3E" alt="LinkedIn">
                </button>
                <button class="social-button facebook-social-button" type="button" data-provider="Facebook" title="Sign in with Facebook">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231877F2'%3E%3Cpath d='M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z'/%3E%3C/svg%3E" alt="Facebook">
                </button>
            </div>
            <p class="provider-feedback" aria-live="polite"></p>
            <p class="account-link">Don't have an account? <a href="index.html">Create one</a></p>
        </div>
    </main>

    <div class="social-auth-modal is-hidden" id="social-auth-modal" aria-hidden="true">
        <div class="social-auth-modal__card" role="dialog" aria-modal="true" aria-labelledby="social-auth-title">
            <button class="social-auth-modal__close" id="social-auth-close" type="button" aria-label="Close social sign-in">✕</button>
            <div class="social-auth-modal__header">
                <p class="social-auth-modal__eyebrow">Continue with</p>
                <h2 id="social-auth-title">Social sign-in</h2>
                <p id="social-auth-description">Enter your account details to continue.</p>
            </div>
            <form class="social-auth-form" id="social-auth-form">
                <label for="social-auth-email">Email</label>
                <input type="email" id="social-auth-email" placeholder="Enter your email" required>

                <label for="social-auth-name">Display name</label>
                <input type="text" id="social-auth-name" placeholder="Enter your name" required>

                <div class="social-auth-actions">
                    <button class="secondary-button" id="social-auth-cancel" type="button">Cancel</button>
                    <button class="primary-button" type="submit">Continue</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
